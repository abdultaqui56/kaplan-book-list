<div class="shell" [class.shell--collapsed]="collapsed()">
  <nav class="sidebar" aria-label="Main navigation">
    <button
      type="button"
      class="sidebar__toggle"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="!collapsed()"
      aria-controls="sidebar-nav"
    >
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18" />
      </svg>
      <span class="sidebar__label">Menu</span>
    </button>

    <ul id="sidebar-nav" class="sidebar__list">
      @for (item of navItems; track item.label) {
        <li>
          <a href="#" class="sidebar__item" (click)="$event.preventDefault()">
            @switch (item.icon) {
              @case ('content') {
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="1.5" />
                  <path d="M3 9h18M7 6.5h.01M10 6.5h.01M13 6.5h.01" />
                  <path d="M12 16.5l5.5-5.5 2 2-5.5 5.5H12z" />
                </svg>
              }
              @case ('courses') {
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 3h10l4 4v14H6z" />
                  <path d="M12 16.5l5.5-5.5 2 2-5.5 5.5H12z" />
                </svg>
              }
            }
            <span class="sidebar__label">{{ item.label }}</span>
            @if (item.hasChildren) {
              <svg class="icon icon--chevron sidebar__label" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 9l6 6 6-6" />
              </svg>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="main">
    <header class="topbar">
      <a href="#" class="brand" (click)="$event.preventDefault()" aria-label="Home">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="10" cy="10" r="7" />
          <circle cx="22" cy="12" r="4" />
          <circle cx="12" cy="24" r="5" />
        </svg>
        <span class="brand__name">atom</span>
      </a>
    </header>

    <main class="content">
      <ng-content />
    </main>
  </div>
</div>
